# Dependabot opens grouped pull requests weekly. No pull request merges automatically:
# CI checks, typecheck, architecture rules, tests, and gitleaks judge each update.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: main
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      observability:
        patterns:
          - '@langfuse/*'
          - '@opentelemetry/*'
      ai-sdk:
        patterns:
          - 'ai'
          - '@ai-sdk/*'
      minor-and-patch:
        patterns:
          - '*'
        exclude-patterns:
          - '@langfuse/*'
          - '@opentelemetry/*'
          - 'ai'
          - '@ai-sdk/*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: main
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns:
          - '*'
