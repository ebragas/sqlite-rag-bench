      <!-- Vertical gridlines & domain floor -->
      <line x1="244" y1="48" x2="244" y2="420" stroke="#1e2124" stroke-opacity="0.25" stroke-width="1"/>
      <line x1="368" y1="56" x2="368" y2="420" stroke="#1e2124" stroke-opacity="0.08" stroke-width="0.8"/>
      <line x1="492" y1="56" x2="492" y2="420" stroke="#1e2124" stroke-opacity="0.08" stroke-width="0.8"/>
      <line x1="616" y1="56" x2="616" y2="420" stroke="#1e2124" stroke-opacity="0.08" stroke-width="0.8"/>
      <line x1="740" y1="56" x2="740" y2="420" stroke="#1e2124" stroke-opacity="0.08" stroke-width="0.8"/>
      <line x1="864" y1="56" x2="864" y2="420" stroke="#1e2124" stroke-opacity="0.08" stroke-width="0.8"/>

