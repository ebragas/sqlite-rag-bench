      <text x="568" y="300" fill="#5c6066" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">50.6%</text>

      <!-- Amazon Q (Kendra): 49% -->
      <rect x="244" y="328" width="304" height="26" rx="3" fill="#fafaf7"/>
      <rect x="244" y="328" width="304" height="26" rx="3" fill="#1e2124" fill-opacity="0.05" stroke="#5c6066" stroke-width="1"/>
      <text x="232" y="339" fill="#1e2124" font-size="10.5" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="end">Amazon Q (Kendra)</text>
