<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="leaderboard-context-light-title leaderboard-context-light-desc" id="leaderboard-context-light-root">
      <title id="leaderboard-context-light-title">Benchmark context: sqlite-rag-bench ranked alongside public Onyx EnterpriseRAG-Bench systems</title>
      <desc id="leaderboard-context-light-desc">Horizontal bar chart on a 0 to 100% scale ranking sqlite-rag-bench prod (88.0% composite, 89.2% on 490 standard-labeled questions over a 21.6K-document slice) alongside seven public Onyx EnterpriseRAG-Bench Leaderboard systems evaluated on the full 511K-document corpus: Intera AI 96.2%, Unblocked 88.5%, Minimal RAG 75.9%, OpenAI File Search 61.0%, BM25 plus GPT-5.4 50.6%, Amazon Q 49.0%, and LlamaIndex default 27.2%.</desc>

      <!-- Clean paper ground -->
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #leaderboard-context-light-root { --color-paper:  #fafaf7;
      --color-ink:    #1e2124;
      --color-muted:  #5c6066;
      --color-accent: #2b5945;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace; }
      #leaderboard-context-light-root { font-family: var(--font-sans); color: var(--color-ink); }</style>
  </defs>
      <rect width="100%" height="100%" fill="#fafaf7"/>

      <!-- Top eyebrow -->
