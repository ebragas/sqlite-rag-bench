<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 492" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-light-title architecture-light-desc" id="architecture-light-root">
      <title id="architecture-light-title">sqlite-rag-bench runtime architecture</title>
      <desc id="architecture-light-desc">System architecture showing startup indexing from read-only corpus JSON through Parse, Chunk and Link and Gemini Embeddings into a single SQLite WAL file with an in-memory Float32Array vector index, serving stateless POST /ask queries through a bounded agent loop, four retrieval tools, grounded synthesis with citation validation, and optional Langfuse v4 OpenTelemetry tracing.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-light-root { --color-paper:  #fafaf7;
      --color-ink:    #1e2124;
      --color-muted:  #5c6066;
      --color-accent: #2b5945;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace; }
      #architecture-light-root { font-family: var(--font-sans); color: var(--color-ink); }</style>
        <marker id="architecture-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#5c6066"/>
        </marker>
        <marker id="architecture-light-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2b5945"/>
        </marker>
        <marker id="architecture-light-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1a66c9"/>
        </marker>
      </defs>

      <!-- Clean paper ground -->
      <rect width="100%" height="100%" fill="#fafaf7"/>

      <!-- Zone 1: Startup indexing -->
      <rect x="24" y="24" width="856" height="136" rx="8" fill="#1e2124" fill-opacity="0.02" stroke="#1e2124" stroke-opacity="0.12" stroke-width="0.8"/>
      <rect x="36" y="28" width="248" height="12" rx="2" fill="#fafaf7"/>
      <text x="44" y="37" fill="#545960" font-size="7" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">STARTUP · ONCE PER CORPUS (/health 503 → 200)</text>

      <!-- Zone 2: Query time -->
      <rect x="24" y="184" width="856" height="232" rx="8" fill="#1e2124" fill-opacity="0.02" stroke="#1e2124" stroke-opacity="0.12" stroke-width="0.8"/>
      <rect x="36" y="188" width="240" height="12" rx="2" fill="#fafaf7"/>
      <text x="44" y="197" fill="#545960" font-size="7" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">QUERY TIME · POST /ask (CONCURRENCY 4)</text>

      <!-- Connectors (drawn before nodes, strictly orthogonal, zero crossings) -->
      <!-- N1 Corpus Files -> N2 Parse, Chunk & Link -->
      <line x1="244" y1="100" x2="312" y2="100" stroke="#5c6066" stroke-width="1.2" marker-end="url(#architecture-light-arrow)"/>
      <!-- N2 Parse, Chunk & Link -> N3 Gemini Embeddings -->
      <line x1="560" y1="100" x2="636" y2="100" stroke="#5c6066" stroke-width="1.2" marker-end="url(#architecture-light-arrow)"/>
      <!-- N3 Gemini Embeddings -> N4 SQLite + RAM Index (focal ingest path) -->
      <line x1="860" y1="100" x2="944" y2="100" stroke="#2b5945" stroke-width="1.4" marker-end="url(#architecture-light-arrow-accent)"/>

      <!-- N5 POST /ask -> N6 Bounded Agent Loop -->
      <line x1="244" y1="260" x2="312" y2="260" stroke="#1a66c9" stroke-width="1.2" marker-end="url(#architecture-light-arrow-link)"/>
      <!-- N6 Bounded Agent Loop -> N8 Synthesis & Validator -->
      <line x1="560" y1="260" x2="636" y2="260" stroke="#1a66c9" stroke-width="1.2" marker-end="url(#architecture-light-arrow-link)"/>
      <!-- N6 Bounded Agent Loop -> N7 Retrieval Tools -->
      <line x1="436" y1="300" x2="436" y2="340" stroke="#2b5945" stroke-width="1.2" marker-end="url(#architecture-light-arrow-accent)"/>
      <!-- N7 Retrieval Tools -> N4 SQLite + RAM Index (single-bend L-path into bottom edge) -->
      <path d="M 560,368 H 1052 Q 1060,368 1060,360 V 208" fill="none" stroke="#2b5945" stroke-width="1.4" marker-end="url(#architecture-light-arrow-accent)"/>
      <!-- N5 POST /ask -> N9 Langfuse v4 OTel (optional dashed) -->
      <line x1="144" y1="300" x2="144" y2="340" stroke="#5c6066" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-light-arrow)"/>

      <!-- Arrow labels (opaque paper mask, 8px clear of stroke) -->
      <rect x="252" y="76" width="52" height="16" rx="2" fill="#fafaf7"/>
      <text x="278" y="87" fill="#5c6066" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>

      <rect x="572" y="76" width="52" height="16" rx="2" fill="#fafaf7"/>
      <text x="598" y="87" fill="#5c6066" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CHUNKS</text>

      <rect x="868" y="76" width="68" height="16" rx="2" fill="#fafaf7"/>
      <text x="902" y="87" fill="#2b5945" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WAL · 768D</text>

      <rect x="248" y="236" width="60" height="16" rx="2" fill="#fafaf7"/>
      <text x="278" y="247" fill="#1a66c9" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">QUESTION</text>

      <rect x="566" y="236" width="64" height="16" rx="2" fill="#fafaf7"/>
      <text x="598" y="247" fill="#1a66c9" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">READ DOCS</text>

      <rect x="444" y="312" width="76" height="16" rx="2" fill="#fafaf7"/>
      <text x="482" y="323" fill="#2b5945" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TOOL CALLS</text>

      <rect x="650" y="344" width="196" height="16" rx="2" fill="#fafaf7"/>
      <text x="748" y="355" fill="#2b5945" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FTS5 · COSINE · 1–2 HOP GRAPH</text>

      <rect x="152" y="312" width="84" height="16" rx="2" fill="#fafaf7"/>
      <text x="194" y="323" fill="#5c6066" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">OTEL SPANS</text>

      <!-- N1: Corpus Files -->
      <rect x="44" y="60" width="200" height="80" rx="6" fill="#fafaf7"/>
      <rect x="44" y="60" width="200" height="80" rx="6" fill="#5c6066" fill-opacity="0.08" stroke="#545960" stroke-width="1"/>
      <rect x="54" y="68" width="44" height="14" rx="2" fill="none" stroke="#545960" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="76" y="78" fill="#545960" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">CORPUS</text>
      <text x="144" y="106" fill="#1e2124" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Corpus Files</text>
      <text x="144" y="124" fill="#5c6066" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">9 SOURCES · 21,612 DOCS</text>

      <!-- N2: Parse, Chunk & Link -->
      <rect x="312" y="60" width="248" height="80" rx="6" fill="#fafaf7"/>
      <rect x="312" y="60" width="248" height="80" rx="6" fill="#ffffff" stroke="#1e2124" stroke-width="1"/>
      <rect x="322" y="68" width="44" height="14" rx="2" fill="none" stroke="#1e2124" stroke-opacity="0.35" stroke-width="0.8"/>
      <text x="344" y="78" fill="#1e2124" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">INGEST</text>
      <text x="436" y="106" fill="#1e2124" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Parse, Chunk &amp; Link</text>
      <text x="436" y="124" fill="#5c6066" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CATALOG · DETERMINISTIC GRAPH</text>

      <!-- N3: Gemini Embeddings -->
      <rect x="636" y="60" width="224" height="80" rx="6" fill="#fafaf7"/>
      <rect x="636" y="60" width="224" height="80" rx="6" fill="#1e2124" fill-opacity="0.02" stroke="#1e2124" stroke-opacity="0.34" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="646" y="68" width="32" height="14" rx="2" fill="none" stroke="#1e2124" stroke-opacity="0.28" stroke-width="0.8"/>
      <text x="662" y="78" fill="#545960" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">API</text>
      <text x="748" y="106" fill="#1e2124" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Gemini Embeddings</text>
      <text x="748" y="124" fill="#5c6066" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">gemini-embedding-2 · 768D</text>

      <!-- N4: SQLite + RAM Index (FOCAL #1) -->
      <rect x="944" y="60" width="232" height="144" rx="6" fill="#fafaf7"/>
      <rect x="944" y="60" width="232" height="144" rx="6" fill="#2b5945" fill-opacity="0.09" stroke="#2b5945" stroke-width="1.2"/>
      <rect x="954" y="68" width="68" height="14" rx="2" fill="none" stroke="#2b5945" stroke-opacity="0.45" stroke-width="0.8"/>
      <text x="988" y="78" fill="#2b5945" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">SINGLE FILE</text>
      <text x="1060" y="114" fill="#1e2124" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">SQLite + RAM Index</text>
      <text x="1060" y="134" fill="#5c6066" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">FTS5 · METADATA · LINK GRAPH</text>
      <text x="1060" y="150" fill="#5c6066" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">119 MiB Float32Array · 38.8K VEC</text>
      <line x1="960" y1="168" x2="1160" y2="168" stroke="#2b5945" stroke-opacity="0.45" stroke-width="0.8"/>
      <text x="1060" y="186" fill="#2b5945" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">KEYED BY (uuid, content_hash)</text>

      <!-- N5: POST /ask -->
      <rect x="44" y="220" width="200" height="80" rx="6" fill="#fafaf7"/>
      <rect x="44" y="220" width="200" height="80" rx="6" fill="#5c6066" fill-opacity="0.08" stroke="#545960" stroke-width="1"/>
      <rect x="54" y="228" width="36" height="14" rx="2" fill="none" stroke="#545960" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="72" y="238" fill="#545960" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">HTTP</text>
      <text x="144" y="266" fill="#1e2124" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">HTTP Server</text>
      <text x="144" y="284" fill="#5c6066" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">POST /ask · GET /health</text>

      <!-- N6: Bounded Agent Loop (FOCAL #2) -->
      <rect x="312" y="220" width="248" height="80" rx="6" fill="#fafaf7"/>
      <rect x="312" y="220" width="248" height="80" rx="6" fill="#2b5945" fill-opacity="0.09" stroke="#2b5945" stroke-width="1.2"/>
      <rect x="322" y="228" width="40" height="14" rx="2" fill="none" stroke="#2b5945" stroke-opacity="0.45" stroke-width="0.8"/>
      <text x="342" y="238" fill="#2b5945" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">AGENT</text>
      <text x="436" y="266" fill="#1e2124" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Bounded Agent Loop</text>
      <text x="436" y="284" fill="#5c6066" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">TURN 0 · MAX 5 TURNS · TEMP 0</text>

      <!-- N8: Synthesis & Validator -->
      <rect x="636" y="220" width="224" height="80" rx="6" fill="#fafaf7"/>
      <rect x="636" y="220" width="224" height="80" rx="6" fill="#ffffff" stroke="#1e2124" stroke-width="1"/>
      <rect x="646" y="228" width="44" height="14" rx="2" fill="none" stroke="#1e2124" stroke-opacity="0.35" stroke-width="0.8"/>
      <text x="668" y="238" fill="#1e2124" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">VERIFY</text>
      <text x="748" y="266" fill="#1e2124" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Synthesis &amp; Validator</text>
      <text x="748" y="284" fill="#5c6066" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">{ answer, document_ids }</text>

      <!-- N9: Langfuse v4 OTel (optional) -->
      <rect x="44" y="340" width="200" height="60" rx="6" fill="#fafaf7"/>
      <rect x="44" y="340" width="200" height="60" rx="6" fill="#1e2124" fill-opacity="0.02" stroke="#1e2124" stroke-opacity="0.34" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="54" y="348" width="52" height="14" rx="2" fill="none" stroke="#1e2124" stroke-opacity="0.28" stroke-width="0.8"/>
      <text x="80" y="358" fill="#545960" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">OPTIONAL</text>
      <text x="144" y="378" fill="#1e2124" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Langfuse v4 OTel</text>
      <text x="144" y="392" fill="#5c6066" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">TRACES · EVALS · TRACEPARENT</text>

      <!-- N7: 4 Retrieval Tools -->
      <rect x="312" y="340" width="248" height="60" rx="6" fill="#fafaf7"/>
      <rect x="312" y="340" width="248" height="60" rx="6" fill="#1e2124" fill-opacity="0.05" stroke="#5c6066" stroke-width="1"/>
      <rect x="322" y="348" width="48" height="14" rx="2" fill="none" stroke="#5c6066" stroke-opacity="0.45" stroke-width="0.8"/>
      <text x="346" y="358" fill="#5c6066" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">4 TOOLS</text>
      <text x="436" y="378" fill="#1e2124" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Retrieval &amp; Graph Tools</text>
      <text x="436" y="392" fill="#5c6066" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">search · filter · fetch · expand_graph</text>

      <!-- Legend strip -->
      <line x1="24" y1="436" x2="1176" y2="436" stroke="#1e2124" stroke-opacity="0.12" stroke-width="0.8"/>
      <text x="24" y="452" fill="#5c6066" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">LEGEND</text>

      <rect x="24" y="464" width="14" height="10" rx="2" fill="#2b5945" fill-opacity="0.09" stroke="#2b5945" stroke-width="1"/>
      <text x="44" y="472" fill="#5c6066" font-size="9" font-family="'Geist', system-ui, sans-serif">Focal engine / store</text>

      <rect x="176" y="464" width="14" height="10" rx="2" fill="#ffffff" stroke="#1e2124" stroke-width="1"/>
      <text x="196" y="472" fill="#5c6066" font-size="9" font-family="'Geist', system-ui, sans-serif">Core stage</text>

      <rect x="284" y="464" width="14" height="10" rx="2" fill="#1e2124" fill-opacity="0.05" stroke="#5c6066" stroke-width="1"/>
      <text x="304" y="472" fill="#5c6066" font-size="9" font-family="'Geist', system-ui, sans-serif">Local tool surface</text>

      <rect x="424" y="464" width="14" height="10" rx="2" fill="#1e2124" fill-opacity="0.02" stroke="#1e2124" stroke-opacity="0.34" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="444" y="472" fill="#5c6066" font-size="9" font-family="'Geist', system-ui, sans-serif">External / opt-in API</text>

      <line x1="584" y1="469" x2="612" y2="469" stroke="#2b5945" stroke-width="1.4" marker-end="url(#architecture-light-arrow-accent)"/>
      <text x="620" y="472" fill="#5c6066" font-size="9" font-family="'Geist', system-ui, sans-serif">Index / retrieval path</text>

      <line x1="764" y1="469" x2="792" y2="469" stroke="#1a66c9" stroke-width="1.2" marker-end="url(#architecture-light-arrow-link)"/>
      <text x="800" y="472" fill="#5c6066" font-size="9" font-family="'Geist', system-ui, sans-serif">Query flow</text>

      <text x="1176" y="472" fill="#5c6066" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">NODE 20+ · ZERO EXTERNAL DAEMONS · 1.3 GiB PEAK RSS</text>
    </svg>
